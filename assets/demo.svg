  </style>
  <rect width="880" height="528" rx="12" fill="#0b1020" stroke="#334155"/>
  <path d="M0 12a12 12 0 0 1 12-12h856a12 12 0 0 1 12 12v24H0z" fill="#1e293b"/>
  <circle cx="20" cy="18" r="6" fill="#f87171"/><circle cx="40" cy="18" r="6" fill="#fbbf24"/><circle cx="60" cy="18" r="6" fill="#34d399"/>
  <text x="440" y="23" text-anchor="middle" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13">seo-skills: auditing a fresh Vite app</text>
  <g font-family="ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,Menlo,monospace" font-size="15">
    <text class="r0" x="30" y="70" xml:space="preserve"><tspan fill="#22c55e">$ </tspan><tspan fill="#e2e8f0">npm create vite@latest starter -- --template react</tspan></text>
    <text class="r1" x="30" y="95" xml:space="preserve"><tspan fill="#22c55e">$ </tspan><tspan fill="#e2e8f0">npm run build &amp;&amp; npx vite preview</tspan></text>
    <text class="r3" x="30" y="134" xml:space="preserve"><tspan fill="#a78bfa">&gt; </tspan><tspan fill="#e2e8f0">/seo audit http://localhost:4173</tspan></text>
    <text class="r5" x="30" y="173" xml:space="preserve"><tspan fill="#e2e8f0">Foundation score: </tspan><tspan fill="#f87171" font-weight="700">58/100 (D)</tspan></text>
    <text class="r6" x="30" y="198" xml:space="preserve"><tspan fill="#94a3b8">9 failed, 2 warnings and 13 passed. Platform: Vite.</tspan></text>
    <text class="r8" x="30" y="237" xml:space="preserve"><tspan fill="#f8fafc" font-weight="700">Fix first</tspan></text>
    <text class="r9" x="30" y="262" xml:space="preserve"><tspan fill="#e2e8f0">1. Content is in the HTML, not only in JavaScript</tspan></text>
    <text class="r10" x="30" y="287" xml:space="preserve"><tspan fill="#f87171">   0 characters of text in the raw HTML, empty app root</tspan></text>
    <text class="r11" x="30" y="312" xml:space="preserve"><tspan fill="#e2e8f0">2. A sitemap exists</tspan></text>
    <text class="r12" x="30" y="337" xml:space="preserve"><tspan fill="#f87171">   No sitemap in robots.txt or at /sitemap.xml</tspan></text>
    <text class="r13" x="30" y="362" xml:space="preserve"><tspan fill="#e2e8f0">3. Missing pages return a real 404</tspan></text>
    <text class="r14" x="30" y="387" xml:space="preserve"><tspan fill="#f87171">   A made-up URL returns 200</tspan></text>
    <text class="r15" x="30" y="412" xml:space="preserve"><tspan fill="#e2e8f0">4. The homepage has crawlable links</tspan></text>
    <text class="r16" x="30" y="437" xml:space="preserve"><tspan fill="#f87171">   No internal &lt;a href&gt; links in the raw HTML</tspan></text>
    <text class="r17" x="30" y="462" xml:space="preserve"><tspan fill="#e2e8f0">5. Pages have a meta description</tspan></text>
    <text class="r18" x="30" y="487" xml:space="preserve"><tspan fill="#f87171">   /: no meta description</tspan></text>
  </g>
</svg>
