<svg xmlns="http://www.w3.org/2000/svg" width="880" height="528" viewBox="0 0 880 528" role="img" aria-labelledby="t d">
  <title id="t">SEO audit of a fresh Vite app</title>
  <desc id="d">A fresh npm create vite app scores 58 out of 100, with 9 failed checks. Its homepage has 0 characters of text in the raw HTML, no sitemap, and made-up URLs return 200.</desc>
  <style>
.r0{animation:r0 16s linear infinite}@keyframes r0{0%,3.13%{opacity:0}3.44%,97%{opacity:1}100%{opacity:0}}
.r1{animation:r1 16s linear infinite}@keyframes r1{0%,9.38%{opacity:0}9.69%,97%{opacity:1}100%{opacity:0}}
.r3{animation:r3 16s linear infinite}@keyframes r3{0%,17.50%{opacity:0}17.81%,97%{opacity:1}100%{opacity:0}}
.r5{animation:r5 16s linear infinite}@keyframes r5{0%,28.75%{opacity:0}29.06%,97%{opacity:1}100%{opacity:0}}
.r6{animation:r6 16s linear infinite}@keyframes r6{0%,30.00%{opacity:0}30.31%,97%{opacity:1}100%{opacity:0}}
.r8{animation:r8 16s linear infinite}@keyframes r8{0%,35.00%{opacity:0}35.31%,97%{opacity:1}100%{opacity:0}}
.r9{animation:r9 16s linear infinite}@keyframes r9{0%,37.50%{opacity:0}37.81%,97%{opacity:1}100%{opacity:0}}
.r10{animation:r10 16s linear infinite}@keyframes r10{0%,37.50%{opacity:0}37.81%,97%{opacity:1}100%{opacity:0}}
.r11{animation:r11 16s linear infinite}@keyframes r11{0%,41.88%{opacity:0}42.19%,97%{opacity:1}100%{opacity:0}}
.r12{animation:r12 16s linear infinite}@keyframes r12{0%,41.88%{opacity:0}42.19%,97%{opacity:1}100%{opacity:0}}
.r13{animation:r13 16s linear infinite}@keyframes r13{0%,46.25%{opacity:0}46.56%,97%{opacity:1}100%{opacity:0}}
.r14{animation:r14 16s linear infinite}@keyframes r14{0%,46.25%{opacity:0}46.56%,97%{opacity:1}100%{opacity:0}}
.r15{animation:r15 16s linear infinite}@keyframes r15{0%,50.63%{opacity:0}50.94%,97%{opacity:1}100%{opacity:0}}
.r16{animation:r16 16s linear infinite}@keyframes r16{0%,50.63%{opacity:0}50.94%,97%{opacity:1}100%{opacity:0}}
.r17{animation:r17 16s linear infinite}@keyframes r17{0%,55.00%{opacity:0}55.31%,97%{opacity:1}100%{opacity:0}}
