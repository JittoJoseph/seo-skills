<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">SEO Skills</title>
  <desc id="d">SEO skills for AI coding agents. A website looks complete in a browser, but a crawler reading the raw HTML sees an empty page with 0 characters of text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#101a33"/></linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.3" r="0.7"><stop offset="0" stop-color="#22c55e" stop-opacity="0.16"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/></pattern>
  </defs>
  <style>
    .scan { animation: scan 4s ease-in-out infinite; }
    @keyframes scan { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(264px); } }
    @media (prefers-reduced-motion: reduce) { .scan { animation: none; } }
  </style>
  <rect width="1280" height="420" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="16" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="16" fill="url(#glow)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="64" y="118" fill="#22c55e" font-size="16" font-weight="700" letter-spacing="2.5">FOR AI CODING AGENTS</text>
    <text x="62" y="192" fill="#f8fafc" font-size="74" font-weight="800" letter-spacing="-2">SEO Skills</text>
    <text x="64" y="244" fill="#cbd5e1" font-size="27">Your AI agent built the site.</text>
    <text x="64" y="280" fill="#cbd5e1" font-size="27">Can search engines read it?</text>
  </g>
  <rect x="64" y="310" width="436" height="46" rx="8" fill="#020617" stroke="#334155"/>
  <text x="82" y="339" font-family="ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,Menlo,monospace" font-size="17"><tspan fill="#22c55e">$</tspan><tspan fill="#e2e8f0"> npx skills add JittoJoseph/seo-skills</tspan></text>
  <g transform="translate(690 90) scale(1)">
    <!-- What you see -->
    <text x="0" y="-14" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600">What you see</text>
    <rect width="250" height="270" rx="12" fill="#f8fafc"/>
    <path d="M0 12a12 12 0 0 1 12-12h226a12 12 0 0 1 12 12v18H0z" fill="#e2e8f0"/>
    <circle cx="16" cy="15" r="4" fill="#f87171"/><circle cx="30" cy="15" r="4" fill="#fbbf24"/><circle cx="44" cy="15" r="4" fill="#34d399"/>
    <rect x="20" y="50" width="150" height="16" rx="4" fill="#0f172a"/>
    <rect x="20" y="76" width="110" height="16" rx="4" fill="#0f172a"/>
    <rect x="20" y="104" width="205" height="7" rx="3" fill="#94a3b8"/>
    <rect x="20" y="118" width="180" height="7" rx="3" fill="#94a3b8"/>
    <rect x="20" y="140" width="84" height="26" rx="6" fill="#22c55e"/>
    <rect x="20" y="182" width="64" height="62" rx="6" fill="#bfdbfe"/>
    <rect x="93" y="182" width="64" height="62" rx="6" fill="#fde68a"/>
    <rect x="166" y="182" width="64" height="62" rx="6" fill="#fecaca"/>

    <!-- What a crawler sees -->
    <text x="280" y="-14" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600">What a crawler sees</text>
    <rect x="280" width="250" height="270" rx="12" fill="#020617" stroke="#334155"/>
    <g font-family="ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,Menlo,monospace" font-size="14">
      <text x="298" y="42" fill="#64748b">&lt;body&gt;</text>
      <text x="314" y="70" fill="#f87171">&lt;div id="root"&gt;</text>
      <text x="314" y="96" fill="#f87171">&lt;/div&gt;</text>
      <text x="314" y="124" fill="#64748b">&lt;script ...&gt;</text>
      <text x="298" y="152" fill="#64748b">&lt;/body&gt;</text>
    </g>
    <line x1="298" y1="176" x2="512" y2="176" stroke="#1e293b"/>
    <text x="298" y="204" fill="#f87171" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700">0 characters</text>
    <text x="298" y="232" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14">of text in the raw HTML</text>
    <rect class="scan" x="281" y="1" width="248" height="3" fill="#22c55e" opacity="0.8"/>
  </g>
</svg>
