version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The types must match the oldest Node version the skill supports.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
