name: Example report

# Keeps docs/example-report.md as real, current output from the audit. The
# timestamp line is removed so a commit only happens when the report changes.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Audit example.com
        run: |
          mkdir -p docs
          node skills/seo-audit/scripts/audit.ts https://example.com | grep -v '^Generated by seo-skills' > docs/example-report.md
      - name: Commit if the report changed
        run: |
          git add docs/example-report.md
          if git diff --cached --quiet; then
            echo "The report has not changed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh the example report'
          git push
