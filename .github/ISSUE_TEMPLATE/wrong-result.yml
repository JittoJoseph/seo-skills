name: Wrong result
description: A check flagged something that is fine, or missed a real problem
labels: [false-positive]
body:
  - type: input
    id: url
    attributes:
      label: URL audited
      placeholder: https://example.com
    validations:
      required: true
  - type: input
    id: check
    attributes:
      label: Check ID
      description: The name in backticks in the report, for example `soft-404`
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What the report said
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and why
      description: A link to the raw HTML or to documentation helps a lot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown at the end of the report
